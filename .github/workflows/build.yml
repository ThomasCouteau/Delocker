name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: Deverrouilleur-Excel-Windows
          path: target/release/xlsx-deverrouilleur.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build (Apple Silicon + Intel)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: Create universal .app bundle
        run: |
          APP="Deverrouilleur Excel.app"
          mkdir -p "$APP/Contents/MacOS"
          lipo -create \
            target/aarch64-apple-darwin/release/xlsx-deverrouilleur \
            target/x86_64-apple-darwin/release/xlsx-deverrouilleur \
            -output "$APP/Contents/MacOS/xlsx-deverrouilleur"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Déverrouilleur Excel</string>
            <key>CFBundleDisplayName</key><string>Déverrouilleur Excel</string>
            <key>CFBundleIdentifier</key><string>fr.deverrouilleur.excel</string>
            <key>CFBundleExecutable</key><string>xlsx-deverrouilleur</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>1.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>CFBundleDocumentTypes</key>
            <array><dict>
              <key>CFBundleTypeExtensions</key><array><string>xlsx</string><string>xlsm</string></array>
              <key>CFBundleTypeRole</key><string>Viewer</string>
            </dict></array>
          </dict>
          </plist>
          PLIST
          # Signature ad hoc (sans compte développeur Apple)
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" Deverrouilleur-Excel-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Deverrouilleur-Excel-macOS
          path: Deverrouilleur-Excel-macOS.zip
