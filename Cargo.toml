[package]
name = "xlsx-deverrouilleur"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11"] }
regex = "1.13.1"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
